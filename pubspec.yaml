name: liquid_glass_toast
description: >-
  A customizable "liquid glass" toast for Flutter with frosted blur, animated
  entrance, swipe-to-dismiss and centralized per-type theming.
version: 1.0.0
repository: https://github.com/MAHMOUDELSAYED7/liquid_glass_toast
issue_tracker: https://github.com/MAHMOUDELSAYED7/liquid_glass_toast/issues
topics:
  - toast
  - snackbar
  - notification
  - glassmorphism
  - ui

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
